<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Euron AgentStudio</title>
  <desc id="desc">Build AI agent workflows on a canvas, watch every run live, export any flow as Python.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1410"/>
      <stop offset="0.55" stop-color="#2a160c"/>
      <stop offset="1" stop-color="#431b08"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fed7aa" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#fdba74" font-size="20" font-weight="600" letter-spacing="4">EURON</text>
    <text x="70" y="178" fill="#fff7ed" font-size="58" font-weight="700">AgentStudio</text>
    <text x="72" y="222" fill="#fed7aa" font-size="21">Build agent workflows on a canvas. Watch every run live.</text>
    <text x="72" y="252" fill="#fed7aa" font-size="21">Export any flow as a Python script.</text>
    <text x="72" y="290" fill="#fdba74" fill-opacity="0.75" font-size="14" letter-spacing="1">OPEN SOURCE  /  MIT  /  RUNS OFFLINE</text>
  </g>

  <g fill="none" stroke="url(#wire)" stroke-width="2.5">
    <path d="M810 160 C 845 160, 845 96, 880 96"/>
    <path d="M810 160 C 845 160, 845 224, 880 224"/>
    <path d="M990 96 C 1025 96, 1025 160, 1060 160"/>
    <path d="M990 224 C 1025 224, 1025 160, 1060 160"/>
  </g>
  <!-- A horizontal line has a zero-height box, which an objectBoundingBox gradient cannot paint. -->
  <path d="M1170 160 L 1200 160" stroke="#fdba74" stroke-opacity="0.9" stroke-width="2.5"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="700" y="136" width="110" height="48" rx="12" fill="#2b1a10" stroke="#fb923c" stroke-opacity="0.6"/>
      <circle cx="722" cy="160" r="6" fill="#fb923c"/>
      <text x="736" y="165" fill="#fff7ed">Start</text>
    </g>
    <g>
      <rect x="880" y="72" width="110" height="48" rx="12" fill="#2b1a10" stroke="#fdba74" stroke-opacity="0.6"/>
      <circle cx="902" cy="96" r="6" fill="#f59e0b"/>
      <text x="916" y="101" fill="#fff7ed">Classify</text>
    </g>
    <g>
      <rect x="880" y="200" width="110" height="48" rx="12" fill="#2b1a10" stroke="#fdba74" stroke-opacity="0.6"/>
      <circle cx="902" cy="224" r="6" fill="#38bdf8"/>
      <text x="916" y="229" fill="#fff7ed">Search</text>
    </g>
    <g filter="url(#glow)">
      <rect x="1060" y="136" width="110" height="48" rx="12" fill="#3a1d0b" stroke="#fb923c"/>
      <circle cx="1082" cy="160" r="6" fill="#34d399"/>
      <text x="1096" y="165" fill="#fff7ed">Agent</text>
    </g>
    <g>
      <circle cx="1214" cy="160" r="14" fill="#2b1a10" stroke="#34d399" stroke-width="2"/>
      <path d="M1207 160 l5 5 l9 -10" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
