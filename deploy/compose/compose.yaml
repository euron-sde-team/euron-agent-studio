# -----------------------------------------------------------------------------
# Euron AgentStudio: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3120   api 8120   postgres 5452   valkey 6412   floci 4612   worker metrics 9120
# -----------------------------------------------------------------------------
name: agentstudio

x-app-env: &app-env
  # Development mode: the local stack talks to an emulator and links to localhost, both of
  # which production refuses on purpose (Settings.production_problems).
  APP_ENV: development
  TZ: UTC
  LOG_LEVEL: ${AGENTSTUDIO_LOG_LEVEL:-info}
  LOG_FORMAT: json
  PRODUCT_NAME: ${AGENTSTUDIO_PRODUCT_NAME:-Euron AgentStudio}
  DATABASE_URL: postgresql+asyncpg://agentstudio:agentstudio@postgres:5432/agentstudio
  REDIS_URL: redis://valkey:6379/0
  SESSION_SECRET: ${AGENTSTUDIO_SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${AGENTSTUDIO_API_KEY_PEPPER:?run `make env` first}
  ENCRYPTION_KEY: ${AGENTSTUDIO_ENCRYPTION_KEY:?run `make env` first}
  CORS_ORIGINS: http://localhost:${AGENTSTUDIO_WEB_PORT:-3120},http://127.0.0.1:${AGENTSTUDIO_WEB_PORT:-3120}
  WEB_URL: http://localhost:${AGENTSTUDIO_WEB_PORT:-3120}
  PUBLIC_API_URL: http://localhost:${AGENTSTUDIO_API_PORT:-8120}
  # The offline model answers at a hosted model's pace, so live traces have something to
  # show. 0 answers at once; the answers are the same either way.
  OFFLINE_DELAY_MS_PER_100_TOKENS: ${AGENTSTUDIO_OFFLINE_DELAY_MS:-150}
  # Optional real models (leave empty to stay offline):
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OLLAMA_URL: ${OLLAMA_URL:-}

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: agentstudio-api:local
  # As on ECS: a read-only root filesystem with a writable /tmp.
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: agentstudio
      POSTGRES_USER: agentstudio
      POSTGRES_PASSWORD: agentstudio
    ports:
      - "127.0.0.1:${AGENTSTUDIO_PG_PORT:-5452}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentstudio -d agentstudio"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Live traces (one stream per run), cancel flags, rate limits, the model response cache
  # and the dashboard cache. Never the source of truth: Postgres is.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${AGENTSTUDIO_REDIS_PORT:-6412}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: apply the migrations (advisory-locked) before anything else starts.
  migrate:
    <<: *api-image
    command: ["agentstudio", "migrate"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${AGENTSTUDIO_API_PORT:-8120}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Long-polls the run queue and executes flows. Its health check reads its own metrics
  # endpoint; one worker at a time (elected through Valkey) also re-queues runs whose
  # worker vanished and expires approvals past their deadline.
  worker:
    <<: *api-image
    command: ["python", "-m", "agentstudio.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"
    ports:
      - "127.0.0.1:${AGENTSTUDIO_WORKER_METRICS_PORT:-9120}:9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: agentstudio-web:local
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${AGENTSTUDIO_API_PORT:-8120}
      PRODUCT_NAME: ${AGENTSTUDIO_PRODUCT_NAME:-Euron AgentStudio}
    ports:
      - "127.0.0.1:${AGENTSTUDIO_WEB_PORT:-3120}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
